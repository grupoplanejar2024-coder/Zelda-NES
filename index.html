<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Legend of Zelda (NES) — Kubo Touch</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #141824;
      --accent: #d9381e;
      --accent-hover: #f24b30;
      --text: #f5f7fa;
      --muted: #9aa3b2;
      --border: rgba(255, 255, 255, 0.08);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #181e2e 0%, var(--bg) 70%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .launcher {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
      perspective: 1100px;
    }

    .btn-arrow {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: rgba(15, 18, 28, 0.84);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-arrow:hover {
      background: rgba(30, 35, 52, 0.96);
    }

    .btn-arrow:active {
      transform: scale(0.95);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    /* Cartucho NES Dourado 3D */
    .cartridge-stage {
      width: 100%;
      padding: 14px 8px 20px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
      cursor: pointer;
    }

    .nes-gold-cart {
      width: 244px;
      height: 282px;
      position: relative;
      background: linear-gradient(155deg, #e7c96b 0%, #cfa43c 45%, #a87e20 100%);
      border-radius: 5px 5px 3px 3px;
      border: 1px solid #f3dc8c;
      clip-path: polygon(
        0 0,
        100% 0,
        100% calc(100% - 14px),
        calc(100% - 10px) calc(100% - 14px),
        calc(100% - 10px) 100%,
        10px 100%,
        10px calc(100% - 14px),
        0 calc(100% - 14px)
      );
      box-shadow:
        inset 0 2px 3px rgba(255, 248, 200, 0.65),
        inset 0 -5px 8px rgba(72, 48, 4, 0.55),
        inset 3px 0 5px rgba(255, 245, 190, 0.35),
        inset -4px 0 6px rgba(65, 42, 3, 0.55);
      display: flex;
      padding: 16px 14px 18px 14px;
      transform: translateZ(20px);
      filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.72));
    }

    /* Coluna esquerda com ranhuras horizontais */
    .nes-gold-ribs {
      width: 74px;
      height: 100%;
      margin-right: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 4px;
      background: rgba(88, 60, 8, 0.16);
      border-radius: 3px;
      border-right: 1px solid rgba(70, 46, 4, 0.35);
    }

    .nes-rib-line {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(180deg, #7e560a 0%, #eed279 100%);
      box-shadow: 0 1px 1px rgba(60, 38, 2, 0.45);
    }

    /* Área direita com etiqueta e triângulo inferior */
    .nes-gold-right {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .nes-gold-label-recess {
      width: 100%;
      height: 196px;
      padding: 3px;
      background: rgba(82, 55, 6, 0.32);
      border-radius: 4px;
      box-shadow:
        inset 0 2px 4px rgba(55, 35, 2, 0.6),
        0 1px 1px rgba(255, 245, 195, 0.45);
      display: flex;
    }

    .nes-gold-sticker {
      width: 100%;
      height: 100%;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      background: #b68d2a;
      border: 1px solid rgba(68, 44, 4, 0.55);
    }

    .nes-gold-sticker img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Reflexo metálico ao passar o rato */
    .nes-gold-sticker::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 65%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 250, 210, 0.32),
        transparent
      );
      transform: skewX(-25deg);
      transition: left 0.6s ease;
      pointer-events: none;
    }

    .cartridge-stage:hover .nes-gold-sticker::after {
      left: 160%;
    }

    /* Triângulo inferior gravado no cartucho */
    .nes-gold-triangle {
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 13px solid #6b4706;
      filter: drop-shadow(0 1px 0 rgba(255, 242, 185, 0.55));
      margin-bottom: 4px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffd166;
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.45rem;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .btn-play {
      width: 100%;
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
      box-shadow: 0 10px 24px rgba(217, 56, 30, 0.35);
    }

    .btn-play:hover {
      background: var(--accent-hover);
    }

    .btn-play:active {
      transform: scale(0.98);
    }

    .status {
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 18px;
    }

    .status.error {
      color: #ff6b6b;
    }

    /* Área do emulador */
    #emulator-screen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
      z-index: 10;
    }

    #emulator-screen.active {
      display: block;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    .btn-exit {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 50;
    }

    /* Oculta botão "Sair" / exit sobreposto no emulador */
    .ejs_exit_btn,
    .ejs_exit_button,
    [class*="exit"]:not(#btn-exit) {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    @media (max-width: 380px) {
      .nes-gold-cart {
        transform: scale(0.9) translateZ(20px);
      }
    }
  </style>
</head>
<body>
  <main class="launcher" id="launcher">
    <section class="card">
      <div class="top-bar">
        <button class="btn-arrow" id="btn-back-cover" type="button" aria-label="Voltar" title="Voltar">←</button>
        <span style="font-size: 12px; color: var(--muted); font-weight: 600;">KUBO TOUCH 3D</span>
        <span style="width: 38px;"></span>
      </div>

      <div class="cartridge-stage" id="cartridge3d">
        <div class="nes-gold-cart">
          <div class="nes-gold-ribs" id="nes-ribs"></div>
          <div class="nes-gold-right">
            <div class="nes-gold-label-recess">
              <div class="nes-gold-sticker">
                <img id="cover-img" alt="Capa de The Legend of Zelda (NES)" />
              </div>
            </div>
            <div class="nes-gold-triangle"></div>
          </div>
        </div>
      </div>

      <span class="badge">Nintendo Entertainment System • NES</span>
      <h1>The Legend of Zelda</h1>
      <p class="subtitle">Toca em jogar para iniciar o emulador no navegador.</p>
      <button class="btn-play" id="btn-start" type="button">▶ Jogar Agora</button>
      <p class="status" id="status-msg"></p>
    </section>
  </main>

  <section id="emulator-screen" aria-label="Tela do jogo">
    <button class="btn-arrow btn-exit" id="btn-exit" type="button" aria-label="Voltar à capa" title="Voltar à capa">←</button>
    <div id="game"></div>
  </section>

  <script>
    const ROM_FILENAME = "Legend of Zelda, The (USA) (Rev 1).nes";
    const COVER_FILENAME = "nes_thelegendofzelda_2_label_thumb.jpg";

    // Cria as ranhuras horizontais do cartucho NES
    const ribsContainer = document.getElementById("nes-ribs");
    for (let i = 0; i < 20; i++) {
      const rib = document.createElement("span");
      rib.className = "nes-rib-line";
      ribsContainer.appendChild(rib);
    }

    const launcherEl = document.getElementById("launcher");
    const emulatorScreenEl = document.getElementById("emulator-screen");
    const gameContainerEl = document.getElementById("game");
    const coverImgEl = document.getElementById("cover-img");
    const cartridgeStage = document.getElementById("cartridge3d");
    const btnStart = document.getElementById("btn-start");
    const btnExit = document.getElementById("btn-exit");
    const btnBackCover = document.getElementById("btn-back-cover");
    const statusMsg = document.getElementById("status-msg");

    const coverUrl = "./" + encodeURI(COVER_FILENAME);
    coverImgEl.src = coverUrl;

    let coverRetried = false;
    coverImgEl.addEventListener("error", () => {
      if (!coverRetried) {
        coverRetried = true;
        coverImgEl.src = coverUrl + "?v=" + Date.now();
      } else {
        statusMsg.textContent = "Não foi possível carregar a capa. Confere se o ficheiro está na raiz do repositório.";
        statusMsg.classList.add("error");
      }
    });

    // Efeito 3D de inclinação no cartucho
    cartridgeStage.addEventListener("mousemove", (e) => {
      const rect = cartridgeStage.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      const rotateX = (-y / 12).toFixed(2);
      const rotateY = (x / 12).toFixed(2);
      cartridgeStage.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
    });

    cartridgeStage.addEventListener("mouseleave", () => {
      cartridgeStage.style.transition = "transform 0.45s ease";
      cartridgeStage.style.transform = "rotateX(0deg) rotateY(0deg) scale(1)";
    });

    cartridgeStage.addEventListener("mouseenter", () => {
      cartridgeStage.style.transition = "none";
    });

    let emulatorLoaded = false;

    function hideExitButtons() {
      const candidates = document.querySelectorAll("#emulator-screen button, #emulator-screen div, #emulator-screen span, #emulator-screen a");
      candidates.forEach((el) => {
        if (el.id === "btn-exit") return;
        const text = (el.textContent || "").trim().toLowerCase();
        if (text === "× sair" || text === "sair" || text === "x sair") {
          if (el.children.length === 0) {
            el.style.setProperty("display", "none", "important");
            el.style.setProperty("visibility", "hidden", "important");
          }
        }
      });
    }

    const observer = new MutationObserver(() => {
      hideExitButtons();
    });
    observer.observe(document.body, { childList: true, subtree: true });

    function focusGameCanvas() {
      const canvas = gameContainerEl.querySelector("canvas");
      if (canvas) {
        canvas.setAttribute("tabindex", "0");
        canvas.focus({ preventScroll: true });
      }
    }

    window.addEventListener("keydown", (e) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", " "].includes(e.key)) {
        e.preventDefault();
      }
    }, { passive: false });

    async function verificarRomAcessivel(url) {
      try {
        const res = await fetch(url, { method: "HEAD", cache: "no-store" });
        if (!res.ok) {
          return { ok: false, motivo: `Não foi possível aceder à ROM (HTTP ${res.status}).` };
        }
        const len = Number(res.headers.get("content-length") || 0);
        if (res.headers.has("content-length") && len < 1024) {
          return { ok: false, motivo: "O ficheiro da ROM parece vazio ou corrompido (< 1 KB)." };
        }
        return { ok: true };
      } catch (err) {
        return { ok: true };
      }
    }

    function iniciarEmulatorJS(romUrl) {
      if (emulatorLoaded) return;
      emulatorLoaded = true;

      window.EJS_player = "#game";
      window.EJS_core = "nes";
      window.EJS_gameName = "The Legend of Zelda";
      window.EJS_gameUrl = romUrl;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_fullscreenOnLoaded = false;
      window.EJS_virtualGamepad = true;
      window.EJS_backgroundImage = coverUrl;

      const script = document.createElement("script");
      script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      script.async = true;
      script.onload = () => {
        hideExitButtons();
        setTimeout(() => {
          focusGameCanvas();
          hideExitButtons();
        }, 600);
      };
      script.onerror = () => {
        statusMsg.textContent = "Falha ao carregar o motor do EmulatorJS. Verifica a tua ligação.";
        statusMsg.classList.add("error");
      };
      document.body.appendChild(script);
    }

    btnStart.addEventListener("click", async () => {
      statusMsg.classList.remove("error");
      statusMsg.textContent = "A verificar ficheiro da ROM...";

      const romUrl = "./" + encodeURI(ROM_FILENAME);
      const check = await verificarRomAcessivel(romUrl);

      if (!check.ok) {
        statusMsg.textContent = `${check.motivo} Confere o nome exato do ficheiro .nes na pasta.`;
        statusMsg.classList.add("error");
        return;
      }

      launcherEl.style.display = "none";
      emulatorScreenEl.classList.add("active");
      gameContainerEl.style.width = "100%";
      gameContainerEl.style.height = "100%";

      iniciarEmulatorJS(romUrl);
    });

    btnBackCover.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        statusMsg.textContent = "Já estás na tela inicial do jogo.";
      }
    });

    btnExit.addEventListener("click", () => {
      window.location.reload();
    });
  </script>
</body>
</html>
