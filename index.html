<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>The Legend of Zelda (NES) — Kubo Touch</title>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #141824;
      --accent: #d9381e;
      --accent-hover: #f24b30;
      --text: #f5f7fa;
      --muted: #9aa3b2;
      --border: rgba(255, 255, 255, 0.08);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #181e2e 0%, var(--bg) 70%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .launcher {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .cover-wrap {
      position: relative;
      width: 100%;
      max-height: 300px;
      border-radius: 14px;
      overflow: hidden;
      background: #0d1018;
      border: 1px solid var(--border);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      max-height: 300px;
      object-fit: contain;
      display: block;
    }

    .btn-arrow {
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: rgba(15, 18, 28, 0.84);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-arrow:hover {
      background: rgba(30, 35, 52, 0.96);
    }

    .btn-arrow:active {
      transform: scale(0.95);
    }

    .btn-back-cover {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffd166;
      background: rgba(255, 209, 102, 0.12);
      border: 1px solid rgba(255, 209, 102, 0.25);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.45rem;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .btn-play {
      width: 100%;
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
      box-shadow: 0 10px 24px rgba(217, 56, 30, 0.35);
    }

    .btn-play:hover {
      background: var(--accent-hover);
    }

    .btn-play:active {
      transform: scale(0.98);
    }

    .status {
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 18px;
    }

    .status.error {
      color: #ff6b6b;
    }

    /* Área do emulador */
    #emulator-screen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #000;
      z-index: 10;
    }

    #emulator-screen.active {
      display: block;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    .btn-exit {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 50;
    }

    /* Oculta botão "Sair" / exit sobreposto no emulador */
    .ejs_exit_btn,
    .ejs_exit_button,
    [class*="exit"]:not(#btn-exit) {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <main class="launcher" id="launcher">
    <section class="card">
      <div class="cover-wrap">
        <button class="btn-arrow btn-back-cover" id="btn-back-cover" type="button" aria-label="Voltar" title="Voltar">←</button>
        <img id="cover-img" alt="Capa de The Legend of Zelda (NES)" />
      </div>
      <span class="badge">Nintendo Entertainment System • NES</span>
      <h1>The Legend of Zelda</h1>
      <p class="subtitle">Toca em jogar para iniciar o emulador no navegador.</p>
      <button class="btn-play" id="btn-start" type="button">▶ Jogar Agora</button>
      <p class="status" id="status-msg"></p>
    </section>
  </main>

  <section id="emulator-screen" aria-label="Tela do jogo">
    <button class="btn-arrow btn-exit" id="btn-exit" type="button" aria-label="Voltar à capa" title="Voltar à capa">←</button>
    <div id="game"></div>
  </section>

  <script>
    const ROM_FILENAME = "Legend of Zelda, The (USA) (Rev 1).nes";
    const COVER_FILENAME = "nes_thelegendofzelda_2_label_thumb.jpg";

    const launcherEl = document.getElementById("launcher");
    const emulatorScreenEl = document.getElementById("emulator-screen");
    const gameContainerEl = document.getElementById("game");
    const coverImgEl = document.getElementById("cover-img");
    const btnStart = document.getElementById("btn-start");
    const btnExit = document.getElementById("btn-exit");
    const btnBackCover = document.getElementById("btn-back-cover");
    const statusMsg = document.getElementById("status-msg");

    coverImgEl.src = "./" + encodeURI(COVER_FILENAME);

    let emulatorLoaded = false;

    function hideExitButtons() {
      const candidates = document.querySelectorAll("#emulator-screen button, #emulator-screen div, #emulator-screen span, #emulator-screen a");
      candidates.forEach((el) => {
        if (el.id === "btn-exit") return;
        const text = (el.textContent || "").trim().toLowerCase();
        if (text === "× sair" || text === "sair" || text === "x sair") {
          if (el.children.length === 0) {
            el.style.setProperty("display", "none", "important");
            el.style.setProperty("visibility", "hidden", "important");
          }
        }
      });
    }

    const observer = new MutationObserver(() => {
      hideExitButtons();
    });
    observer.observe(document.body, { childList: true, subtree: true });

    function focusGameCanvas() {
      const canvas = gameContainerEl.querySelector("canvas");
      if (canvas) {
        canvas.setAttribute("tabindex", "0");
        canvas.focus({ preventScroll: true });
      }
    }

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", " "].includes(e.key)) {
        e.preventDefault();
      }
    }, { passive: false });
